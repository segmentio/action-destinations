# How each rule in .claude/rules/ is enforced: one entry per live rule ID, and the only
# file that says so. The schema is the one cnd-domain-check's claudeRulesEnforcementV1
# check reads.
#
# enforcement:
#   ci            a CI job runs a check that fails on a break: name the job and the check
#   review-agent  only judgment decides it, so the review agent gets the rule's text
#   both          a check decides part of it and the review agent the rest
#   platform      a GitHub or other platform setting stops a break: give its https URL
#   guidance      it governs how a person or agent session behaves, which no diff or
#                 setting shows: no check is claimed, so no ci, checks, mode, enforced
#                 or platform
#   pending       nothing checks it yet: a comment on the ID line names the plan or why
#
# A check that only warns is `mode: report-only` plus `enforced: partial` on its ci entry,
# so the review agent still reads the rule. A test named under `checks` names its rule
# (test_arc_01_..., or a tag such as @enforces("ARC-01")), so the claim is provable.
#
# Write only a YAML subset, so a stdlib checker can read it: two-space indents, `key: value`,
# `key: [a, b]` on one line, `key: {}` and `#` comments. No `- item` lists, no `{a: b}` maps.
#
#   jobs:
#     unit-tests:
#       step: unit-tests            # the CI step's key (a CND repo: block + derived step)
#       command: make test
#       runs: always                # always | on-change
version: 1

jobs: {}

rules:
  ARC-01:
    file: .claude/rules/architecture.md
    enforcement: review-agent
