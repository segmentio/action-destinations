name: Claude rules

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check-enforcement:
    name: Check rule enforcement registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 tests/claude-rules/check_enforcement.py .
