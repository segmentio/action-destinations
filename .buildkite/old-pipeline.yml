# Paste this into cdp-action-destinations -> Settings -> Steps (Buildkite UI).
# Internal-only publish to Twilio's NPM Artifactory, run manually alongside
# (not instead of) the existing public npmjs.org release in
# .github/workflows/publish.yml (Lerna + GitHub OIDC trusted publishing).
#
# Deliberately lives ONLY here in Buildkite, not as a committed file in
# segmentio/action-destinations (public repo) -- this avoids putting internal
# Twilio infra details (Artifactory hostname, ECR account, plugin refs,
# secret name) into a public, OSS-contributor-visible tree. Buildkite still
# checks out the real action-destinations source at build time regardless of
# where this step definition lives (see pipeline's Repository setting).
#
# Every publishable package.json hardcodes `publishConfig.registry` to
# registry.npmjs.org. npm (and Lerna, which shells out to npm) honor that
# field over any --registry flag or .npmrc registry setting on `publish`, so
# the Publish step rewrites it to the Artifactory URL in the ephemeral
# checkout only -- nothing is ever committed or pushed back to GitHub.
#
# Hardened Twilio agents (general-039) block public npm/yarn registry
# egress, so install also routes through virtual-npm-twilio, which
# aggregates the public thirdparty proxy and serves private @segment/*
# packages (same registry used for install and publish, per the
# action-cli / action-emitters Buildkite pipelines).
#
# NOTE: every literal `$` below is doubled ($$) on purpose -- Buildkite
# interpolates $VAR/${VAR} in this YAML at upload time, so a single $ would
# be swallowed before the runtime shell (or the embedded Node script) ever
# sees it.

env:
  # NOTE: no nested env-var reference here (e.g. NODE_IMAGE: '${ECR_REGISTRY}/...').
  # Build #2 failed with "docker: invalid reference format" because Buildkite's
  # interpolation of the pipeline's static `configuration` (set via the Pipelines
  # API) does NOT resolve one env: entry referencing another -- ECR_REGISTRY came
  # back empty, leaving a bare leading slash. This works fine when a pipeline.yml
  # is dynamically uploaded via `buildkite-agent pipeline upload` (see
  # action-emitters' pipeline.twilio.yml, which uses the same nested pattern) but
  # not for a pipeline's initial static Steps config -- so the full path is
  # inlined directly instead.
  NODE_IMAGE: '018537234677.dkr.ecr.us-east-1.amazonaws.com/docker.io/library/node:22.18.0-bookworm'
  ARTIFACTORY_NPM: 'https://npmjs.artifacts.twilio.com/artifactory/api/npm/virtual-npm-twilio/'
  # Build #3 failed: playwright-webkit's postinstall tries to download a WebKit
  # browser binary from cdn.playwright.dev / Microsoft's CDN, which the hardened
  # agent's egress blocks (ECONNRESET / connect timeout). We only need `yarn
  # build`, not browser tests, so skip the download entirely.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

agents:
  queue: general-039

steps:
  - label: ':yarn: Build'
    key: 'build'
    timeout_in_minutes: 30
    command: |
      node --version
      npm config set registry "$${ARTIFACTORY_NPM}"
      yarn config set registry "$${ARTIFACTORY_NPM}"
      sed -i "s#https://registry.yarnpkg.com/#$${ARTIFACTORY_NPM}#g" yarn.lock
      yarn install --frozen-lockfile --network-concurrency 1
      if [ -n "$${PUBLISH_SCOPE:-}" ]; then
        echo "--- Build ($${PUBLISH_SCOPE} and its dependency graph only)"
        NODE_ENV=production yarn nx build "$${PUBLISH_SCOPE}"
      else
        echo "--- Build (all packages)"
        NODE_ENV=production yarn build
      fi
    plugins:
      - docker#v5.13.0:
          image: '${NODE_IMAGE}'
          propagate-environment: true
          environment:
            - CI=true
            - HUSKY=0
            - ARTIFACTORY_NPM
            - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
            - PUBLISH_SCOPE

  - wait: ~

  - block: ':rocket: Publish to NPM Artifactory'
    prompt: "Publish action-destinations packages to Twilio's NPM Artifactory? Confirm the weekly version-bump has already landed on main."
    branches: 'main,staging'

  - label: ':artifactory: Publish to Artifactory'
    key: 'publish'
    if: build.branch == "main" || build.branch == "staging"
    timeout_in_minutes: 30
    plugins:
      - twilio-internal/admiral-secret#v0.1.0:
          realm: corp-us1
          secrets:
            - key-full: NPM_ARTIFACTORY_SECRET
              secret-name: jobs_jenkins_npm_credentials
      - twilio-internal/npm-artifactory#v1.1.0:
          secret-name: 'NPM_ARTIFACTORY_SECRET'
          scope: '@segment'
      - docker#v5.13.0:
          image: '${NODE_IMAGE}'
          propagate-environment: true
          environment:
            - CI=true
            - HUSKY=0
            - ARTIFACTORY_NPM
            - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
            - PUBLISH_SCOPE
            - PUBLISH_TEST_VERSION
            - PUBLISH_FORCE
            - BUILDKITE_BRANCH
    command: |
      npm config set registry "$${ARTIFACTORY_NPM}"
      yarn config set registry "$${ARTIFACTORY_NPM}"
      sed -i "s#https://registry.yarnpkg.com/#$${ARTIFACTORY_NPM}#g" yarn.lock
      yarn install --frozen-lockfile --network-concurrency 1
      if [ -n "$${PUBLISH_SCOPE:-}" ]; then
        echo "--- Build ($${PUBLISH_SCOPE} and its dependency graph only)"
        NODE_ENV=production yarn nx build "$${PUBLISH_SCOPE}"
      else
        echo "--- Build (all packages)"
        NODE_ENV=production yarn build
      fi
      echo "--- Rewriting publishConfig.registry -> Artifactory (this checkout only)"
      # NOTE: the docker-buildkite-plugin runs this command under /bin/sh
      # (dash on the node:bookworm image), not bash -- `read -d ''` and
      # process substitution `<(...)` are bash-only and silently break here.
      # Doing the whole recursive patch as one Node script sidesteps that
      # entirely. When PUBLISH_SCOPE is set it also captures that package's
      # directory (stdout carries ONLY the path; the per-file log lines go to
      # stderr so they don't end up inside the captured value).
      #
      # packages/browser-destinations and packages/warehouse-destinations
      # (and everything under each, e.g. browser-destinations'
      # destinations/<slug> sub-packages) are skipped entirely -- those are
      # public-npm-only and must never be rewritten or published to
      # Artifactory.
      #
      # Only packages/actions-shared, packages/destination-actions, and
      # packages/core get renamed + republished with an "-internal" suffix
      # (e.g. @segment/action-destinations -> @segment/action-destinations-internal)
      # so Artifactory installs are unambiguously distinct from the public
      # npmjs.org package of the same base name -- avoids anyone accidentally
      # depending on the internal-only build, or confusing the two when
      # browsing Artifactory. Every other publishable package's
      # publishConfig.registry still gets pointed at Artifactory (so the
      # install/build graph resolves there) but keeps its original name.
      # PUBLISH_SCOPE is matched against the ORIGINAL (un-suffixed) name --
      # the suffix is applied after matching, so callers keep passing the
      # public package name, e.g. PUBLISH_SCOPE=@segment/action-destinations.
      # Internal cross-package dependency ranges (e.g. this package's
      # dependency on @segment/actions-core) are left as-is: they still
      # resolve via virtual-npm-twilio's public-npmjs mirror side, not the
      # renamed Artifactory-only package.
      #
      # PUBLISH_TEST_VERSION (only ever applied when PUBLISH_SCOPE is also
      # set -- never for the unrestricted/production path) overrides the
      # scoped package's version before publish. This exists because
      # virtual-npm-twilio is a VIRTUAL registry that also proxies public
      # npmjs -- @segment/action-destinations already has 2700+ versions
      # there from the weekly public release, so testing against its real
      # current version can never prove the internal-only publish path
      # actually works: the "already published" check would always find a
      # match via the public-mirror side regardless of whether Artifactory's
      # private side has ever received it. A version string guaranteed not
      # to exist publicly (e.g. 3.497.0-twilio-internal-test.1) proves it.
      matched_dir="$$(REGISTRY="$${ARTIFACTORY_NPM}" SCOPE="$${PUBLISH_SCOPE}" TEST_VERSION="$${PUBLISH_TEST_VERSION}" node -e '
        const fs = require("fs");
        const path = require("path");
        const registry = process.env.REGISTRY;
        const scope = process.env.SCOPE || "";
        const testVersion = process.env.TEST_VERSION || "";
        const RENAME_DIRS = new Set(["actions-shared", "destination-actions", "core"]);
        let matchedDir = "";
        function walk(dir) {
          for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
            if (entry.name === "node_modules") continue;
            const full = path.join(dir, entry.name);
            if (entry.isDirectory()) {
              if (dir === "packages" && (entry.name === "browser-destinations" || entry.name === "warehouse-destinations")) continue;
              walk(full);
              continue;
            }
            if (entry.name !== "package.json") continue;
            const pkg = JSON.parse(fs.readFileSync(full, "utf8"));
            if (pkg.private || !pkg.publishConfig) continue;
            if (scope && pkg.name !== scope) continue;
            const originalName = pkg.name;
            const topLevelDir = path.relative("packages", path.dirname(full)).split(path.sep)[0];
            pkg.publishConfig.registry = registry;
            if (RENAME_DIRS.has(topLevelDir)) {
              pkg.name = originalName + "-internal";
            }
            if (scope && testVersion) pkg.version = testVersion;
            fs.writeFileSync(full, JSON.stringify(pkg, null, 2) + "\n");
            console.error("  " + originalName + "@" + pkg.version + " -> " + pkg.name + " @ " + registry);
            if (scope) matchedDir = path.dirname(full);
          }
        }
        walk("packages");
        process.stdout.write(matchedDir);
      ')"
      # lerna publish in this repo's Lerna version does not support --scope
      # (yargs rejects it: "Unknown argument: scope") -- for a single-package
      # test, publish directly from that package's directory instead of going
      # through lerna at all. Idempotent, mirrors action-cli/action-emitters'
      # npm-publish-artifactory.sh.
      echo "--- Committing registry/name rewrite locally (never pushed -- this checkout is ephemeral)"
      git config user.email "buildkite@twilio.com"
      git config user.name "Buildkite (cdp-action-destinations)"
      git add -A
      git commit -m "Local-only: rewrite publishConfig.registry and append -internal suffix for Artifactory publish" --no-verify
      if [ -n "$${PUBLISH_SCOPE:-}" ]; then
        if [ -z "$$matched_dir" ]; then
          echo "No package matched PUBLISH_SCOPE=$${PUBLISH_SCOPE}" >&2
          exit 1
        fi
        echo "--- Publishing single package from $$matched_dir"
        cd "$$matched_dir"
        pkg_name="$$(node -p 'require("./package.json").name')"
        pkg_version="$$(node -p 'require("./package.json").version')"
        if npm view "$${pkg_name}@$${pkg_version}" version --registry "$${ARTIFACTORY_NPM}" >/dev/null 2>&1; then
          echo "$${pkg_name}@$${pkg_version} already published to Artifactory -- skipping"
        else
          if [ "${BUILDKITE_BRANCH}" = "staging" ]; then
            npm publish --registry "${ARTIFACTORY_NPM}" --tag canary
          else
            npm publish --registry "${ARTIFACTORY_NPM}" --tag latest
          fi
        fi
      else
        echo "--- Publishing via lerna (from-package, idempotent against Artifactory)"
        if [ "${PUBLISH_FORCE:-}" = "true" ]; then
          echo "--- PUBLISH_FORCE=true -- forcing lerna to attempt every package regardless of registry state"
          if [ "${BUILDKITE_BRANCH}" = "staging" ]; then
            yarn lerna publish from-package --yes --loglevel=verbose --dist-tag canary --registry "${ARTIFACTORY_NPM}" --force-publish
          else
            yarn lerna publish from-package --yes --loglevel=verbose --dist-tag latest --registry "${ARTIFACTORY_NPM}" --force-publish
          fi
      else
        if [ "${BUILDKITE_BRANCH}" = "staging" ]; then
          yarn lerna publish from-package --yes --loglevel=verbose --dist-tag canary --registry "${ARTIFACTORY_NPM}"
        else
          yarn lerna publish from-package --yes --loglevel=verbose --dist-tag latest --registry "${ARTIFACTORY_NPM}"
        fi
      fi

      fi
